<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: lavender;
        }

        .parentBox {
            display: grid;
            height: 200px;
            width: 200px;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
        }

        .child {
            border: 2px solid black;
            height: 50px;
            width: 50px;
            background-color: white;
        }

        /* Chess board checkerboard pattern (4-column grid) */
        .child:nth-child(8n+1),
        .child:nth-child(8n+3),
        .child:nth-child(8n+6),
        .child:nth-child(8n+8) {
            background-color: black;
        }
    </style>
</head>

<body>
    <div class="parentBox">
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
    </div>
</body>

</html>
